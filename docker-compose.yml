version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aristocolors-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aristocolors}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aristocolors_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-aristocolors_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aristocolors} -d ${POSTGRES_DB:-aristocolors_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aristocolors-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
