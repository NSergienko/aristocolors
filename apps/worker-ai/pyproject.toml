[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aristocolors-worker-ai"
version = "0.1.0"
description = "Python 3.11 Stateless ML Runtime Service for AristoColors GPU Computation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AristoColors Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.2",
    "httpx>=0.27.2",
    "numpy>=1.26.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0"
]
gpu = [
    "torch>=2.3.0",
    "torchvision>=0.18.0"
]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
